# Version catalog for ascham. Versions verified against Maven Central / the Gradle Plugin
# Portal at implementation kickoff (2026-07). jmh/jcstress entries are added at their
# milestones (M2 bench, M4 concurrency) to avoid pulling plugin machinery in early.

[versions]
agrona = "2.5.0"
arrow = "19.0.0"
junit = "5.14.4"
assertj = "3.27.7"
jmh = "1.37"
jmh-plugin = "0.7.3"
jcstress = "0.16"
jcstress-plugin = "0.9.0"
# duckdb_jdbc: query-side extension host and the cold IT read-back check. Must match the DuckDB
# the arena extension is built against (v1.5.5) — a loadable extension is rejected by a host of a
# different version. No longer the roll engine.
duckdb = "1.5.5.0"
# iceberg: the cold tier's roll engine — native table create/write/commit. 1.11 is the first
# release with timestamp_ns/timestamptz_ns as native v3 types.
iceberg = "1.11.0"
# hadoop-client-api/runtime: the shaded pair satisfying parquet-hadoop's `provided` Hadoop deps
# and providing Configuration/FileSystem for HadoopCatalog. Not the full hadoop-common sprawl.
hadoop = "3.4.1"
# parquet-column: compile-time only — iceberg-parquet's Gradle metadata keeps parquet off the
# consumer compile classpath, but Parquet.writeData's createWriterFunc signature needs MessageType.
# Must match the version iceberg-parquet resolves at runtime.
parquet = "1.17.1"

[libraries]
agrona = { module = "org.agrona:agrona", version.ref = "agrona" }
arrow-vector = { module = "org.apache.arrow:arrow-vector", version.ref = "arrow" }
arrow-memory-core = { module = "org.apache.arrow:arrow-memory-core", version.ref = "arrow" }
arrow-memory-unsafe = { module = "org.apache.arrow:arrow-memory-unsafe", version.ref = "arrow" }
arrow-c-data = { module = "org.apache.arrow:arrow-c-data", version.ref = "arrow" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }

jcstress-core = { module = "org.openjdk.jcstress:jcstress-core", version.ref = "jcstress" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
iceberg-core = { module = "org.apache.iceberg:iceberg-core", version.ref = "iceberg" }
iceberg-parquet = { module = "org.apache.iceberg:iceberg-parquet", version.ref = "iceberg" }
iceberg-data = { module = "org.apache.iceberg:iceberg-data", version.ref = "iceberg" }
iceberg-aws = { module = "org.apache.iceberg:iceberg-aws", version.ref = "iceberg" }
iceberg-aws-bundle = { module = "org.apache.iceberg:iceberg-aws-bundle", version.ref = "iceberg" }
hadoop-client-api = { module = "org.apache.hadoop:hadoop-client-api", version.ref = "hadoop" }
hadoop-client-runtime = { module = "org.apache.hadoop:hadoop-client-runtime", version.ref = "hadoop" }
parquet-column = { module = "org.apache.parquet:parquet-column", version.ref = "parquet" }

[plugins]
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
jcstress = { id = "io.github.reyerizo.gradle.jcstress", version.ref = "jcstress-plugin" }
