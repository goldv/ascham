# Local dev stack for the ascham cold tier: an Iceberg REST catalog (Lakekeeper) over
# S3-compatible object storage (MinIO). See docs/cold-tier-design-plan.md §9.
#
#   docker compose -f dev/docker-compose.yml up -d      # start (idempotent)
#   docker compose -f dev/docker-compose.yml down -v     # stop + wipe warehouse
#
# Host ports are deliberately non-default to coexist with other local stacks:
#   8181  Lakekeeper (Iceberg REST at /catalog, management API at /management/v1)
#   9100  MinIO S3 API      (container 9000 — host 9000 is often taken, e.g. by QuestDB)
#   9101  MinIO console     (container 9001; login minioadmin / minioadmin)
# Postgres is intentionally NOT published — it is Lakekeeper's private metadata store.
name: ito-cold-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Creates the warehouse bucket. Idempotent (`mb --ignore-existing`), exits 0.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ito-warehouse &&
      echo 'bucket ito-warehouse ready'
      "

  # Applies Lakekeeper's schema to Postgres, then exits. Must complete before the server starts.
  catalog-migrate:
    image: quay.io/lakekeeper/catalog:latest
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment: &catalog_env
      LAKEKEEPER__PG_ENCRYPTION_KEY: "dev-only-not-secure"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@db:5432/postgres"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@db:5432/postgres"
      # Advertised to catalog clients in /v1/config `overrides.uri`, which the Iceberg Java REST
      # client honours for every subsequent request — so, like S3_ENDPOINT below, it must be
      # reachable from host clients AND containers. The docker0 gateway is; `lakekeeper` is not.
      LAKEKEEPER__BASE_URI: "${ITO_CATALOG_URI:-http://172.17.0.1:8181}"
      RUST_LOG: "info"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    command: ["serve"]
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    environment: *catalog_env
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot: accept terms (bootstrap) + create the `ito` warehouse over s3://ito-warehouse.
  # Both steps are idempotent — re-running the stack is safe (409/duplicate is tolerated).
  catalog-init:
    image: curlimages/curl:latest
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./catalog-init.sh:/catalog-init.sh:ro
    environment:
      # Must be reachable from host clients AND from containers — see catalog-init.sh for why
      # (the catalog vends this endpoint to clients). Default is the docker0 gateway.
      S3_ENDPOINT: "${ITO_S3_ENDPOINT:-http://172.17.0.1:9100}"
    entrypoint: ["sh", "/catalog-init.sh"]

volumes:
  pgdata:
  miniodata:
