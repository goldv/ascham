[project]
name = "arena-duckdb-python"
version = "0.1.0"
description = "Python client for the arena DuckDB extension, pinned to the DuckDB it was built against."
requires-python = ">=3.10"
# Pinned to v1.5.5: the arena extension statically links DuckDB v1.5.5, so it can only be loaded by a
# matching v1.5.5 host. A different duckdb version here would reject the extension at LOAD time.
dependencies = ["duckdb==1.5.5"]

[tool.uv]
# This project is a script runner, not an installable package — don't try to build/install it.
package = false
