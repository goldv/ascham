# One-line log records for the demo mains. The JDK default prints every record over two lines with a
# full timestamp and source method, which buries the demo's own output. The cold tier logs progress
# at INFO (rolls, reclamations) and problems at WARNING/ERROR, all of which is worth seeing.
handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = [%4$-7s] %5$s%6$s%n
